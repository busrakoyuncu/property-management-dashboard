version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: buena-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-buena_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buena_password}
      POSTGRES_DB: ${POSTGRES_DB:-buena_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-buena_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - buena-network

volumes:
  postgres_data:
    driver: local

networks:
  buena-network:
    driver: bridge
